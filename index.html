<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교직원 자연 유형</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --fg:#1F2328; --muted:#5C636B; --line:#DDDAD3; --ink:#262B31;
  --sun:#A0461A; --sun-soft:#F8E6DA;
  --forest:#2F7346; --forest-soft:#DDEEE2;
  --rock:#5F5850; --rock-soft:#E9E5E0;
  --water:#1F6687; --water-soft:#DCEBF3;
  --focus:#1F6687; --danger:#B3261E;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151719; --surface:#1E2124; --fg:#E8E9EA; --muted:#A0A6AD; --line:#34383D; --ink:#E8E9EA;
  --sun:#EE9A62; --sun-soft:#3B2618; --forest:#6CC08A; --forest-soft:#1C3325;
  --rock:#BDB3A8; --rock-soft:#2E2B28; --water:#6BB6DA; --water-soft:#18303D;
  --focus:#6BB6DA; --danger:#F2867E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151719; --surface:#1E2124; --fg:#E8E9EA; --muted:#A0A6AD; --line:#34383D; --ink:#E8E9EA;
  --sun:#EE9A62; --sun-soft:#3B2618; --forest:#6CC08A; --forest-soft:#1C3325;
  --rock:#BDB3A8; --rock-soft:#2E2B28; --water:#6BB6DA; --water-soft:#18303D;
  --focus:#6BB6DA; --danger:#F2867E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.65;margin:0}
.wrap{max-width:780px;margin:0 auto;padding:36px 16px 80px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.note{font-size:.86rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.ico{display:block;flex:none}

/* 시작 안내 */
.intro{display:flex;flex-direction:column;gap:22px}
.intro .lead{color:var(--muted);max-width:60ch}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.types{grid-template-columns:repeat(2,1fr)}}
.type{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--soft);min-width:0}
.type b{font-family:var(--f-display);font-size:1.15rem;color:var(--c)}
.type span{font-size:.84rem;color:var(--fg);line-height:1.5}
.type .ico{color:var(--c)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;counter-reset:st}
@media (max-width:620px){.steps{grid-template-columns:1fr}}
.namebox{display:flex;flex-direction:column;gap:6px;max-width:360px}
.namebox label{font-weight:700}
.namebox input{font:inherit;font-size:1.05rem;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.namebox input:focus{outline:2px solid var(--focus);outline-offset:1px}
.namebox input[aria-invalid="true"]{border-color:var(--danger)}
.namebox .err{color:var(--danger);font-size:.88rem;min-height:1.2em}
.who{font-weight:700;color:var(--fg)}
.banner .tag .who{font-size:1.15em}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.9rem;counter-increment:st;display:flex;gap:10px;min-width:0}
.steps li::before{content:counter(st);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

/* 문항 */
.stepper{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{font-size:.78rem;text-align:center;padding:6px 4px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.cur{border-color:var(--ink);color:var(--fg);font-weight:700}
.chip.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.meter{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s}
.scene-head{display:flex;flex-direction:column;gap:4px}
ol.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:110px}
.item.done{box-shadow:inset 3px 0 0 var(--ink)}
.q{font-weight:700;display:flex;gap:10px}
.q span{color:var(--muted);font-variant-numeric:tabular-nums;min-width:2ch}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.opt{font-size:.95rem;color:var(--muted);min-width:0;transition:color .15s}
.opt.b{text-align:right}
.opt.on{color:var(--fg);font-weight:500}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;font:inherit;font-size:.78rem;border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--muted);padding:9px 0;width:54px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.seg button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
@media (max-width:600px){
  .pair{grid-template-columns:1fr;gap:8px}
  .opt.b{text-align:left;order:1}
  .opt.a::before{content:"A  ";font-weight:700}
  .opt.b::before{content:"B  ";font-weight:700}
  .seg{order:0}
  .seg button{flex:1;width:auto}
}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.actions .grow{flex:1}
.btn{appearance:none;font:inherit;font-weight:500;border-radius:9px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* 결과 */
.result{display:flex;flex-direction:column;gap:22px}
.banner{border-radius:14px;padding:24px;background:var(--soft);display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.banner .ico{color:var(--c)}
.banner .tag{font-size:.8rem;font-weight:700;color:var(--c);letter-spacing:.04em}
.banner h2{font-size:1.8rem;color:var(--fg)}
.banner h2 em{font-style:normal;color:var(--c)}
.banner p{max-width:52ch}
@media (max-width:560px){.banner{grid-template-columns:1fr;gap:12px}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card ul,.card ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.axes{display:flex;flex-direction:column;gap:8px;font-size:.85rem;color:var(--muted)}
.axis{display:grid;grid-template-columns:3.6em 1fr 3.6em;gap:8px;align-items:center}
.axis .track{height:8px;background:var(--line);border-radius:4px;position:relative}
.axis .track i{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
.axis .r{text-align:right}
.strip{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface)}
.strip i{display:block;min-width:0}
.mix{display:flex;flex-direction:column;gap:8px}
.mixrow{display:grid;grid-template-columns:22px 2.6em 1fr 3em;gap:10px;align-items:center;font-size:.92rem}
.mixrow .ico{color:var(--c)}
.mixrow b{font-weight:500}
.mixrow.main b{font-weight:700;color:var(--c)}
.mbar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--c);border-radius:4px}
.mixrow span{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.quote{font-family:var(--f-display);font-size:1.15rem;line-height:1.5;border-left:4px solid var(--c);padding-left:14px}
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.scenes{grid-template-columns:1fr}}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.scene .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.scene .h b{font-size:.92rem}
.badge{font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--c);white-space:nowrap}
.scene p{font-size:.93rem}
.fourwrap{display:flex;flex-direction:column;gap:12px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){.four{grid-template-columns:1fr 1fr}}
.nat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.nat.me{border:2px solid var(--c);background:var(--soft)}
.nat .nh{display:flex;align-items:center;gap:6px}
.nat .nh .ico{color:var(--c)}
.nat .nh b{font-family:var(--f-display);font-size:1.1rem;color:var(--c)}
.nat .nh .badge{margin-left:auto;background:var(--c);color:var(--surface)}
.nat i{font-style:normal;font-size:.8rem;color:var(--muted);line-height:1.4}
.nat p{font-size:.88rem;line-height:1.5}
.kws{display:flex;flex-wrap:wrap;gap:4px}
.kws span{font-size:.75rem;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--c);font-weight:500}
.nat.me .kws span{background:var(--surface)}
.pairs{display:flex;flex-direction:column;gap:10px}
.pairrow{display:grid;grid-template-columns:auto 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;align-items:start}
.pairrow .ico{color:var(--c)}
.pairrow b{display:block;margin-bottom:2px}
.pairrow i{font-style:normal;color:var(--muted);font-size:.85rem;display:block;margin-bottom:4px}
.pairrow p{font-size:.93rem}
.copybox{width:100%;min-height:96px;font:inherit;font-size:.85rem;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.printonly{display:none}
.savehelp{border:1px solid var(--line);border-left:4px solid var(--focus);background:var(--surface);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.savehelp b{font-size:.95rem}
.savehelp ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}
.savehelp .actions{gap:8px}
.savehelp .btn{padding:8px 14px;font-size:.88rem;text-decoration:none;display:inline-block}
.savehelp input{width:100%;font:inherit;font-size:.8rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.foot-h{font-family:var(--f-body);font-size:.88rem;font-weight:700;color:var(--fg);margin:0}
.toast{font-size:.85rem;color:var(--forest)}
footer{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* 인쇄: 밝은 색으로 고정, 배경색(막대·띠) 강제 출력, A4 2쪽 이내로 압축 */
@page{size:A4;margin:12mm}
@media print{
  :root:not(#_print){
    --bg:#FFFFFF; --surface:#FFFFFF; --fg:#1F2328; --muted:#50575E; --line:#D6D3CC; --ink:#262B31;
    --sun:#A0461A; --sun-soft:#F8E6DA; --forest:#2F7346; --forest-soft:#DDEEE2;
    --rock:#5F5850; --rock-soft:#E9E5E0; --water:#1F6687; --water-soft:#DCEBF3; color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff;height:auto}
  body{font-size:10.5pt;line-height:1.45}
  .noprint,.stepper,footer,.copybox,.copyhint{display:none!important}
  .printonly{display:block!important;font-size:8.5pt;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;break-inside:avoid}
  .wrap{max-width:none;padding:0;gap:9px}
  .result{gap:9px}
  .result h3{font-size:11.5pt}
  .banner{padding:10px 14px;gap:12px;grid-template-columns:auto 1fr;border-radius:8px}
  .banner .ico{width:40px;height:40px}
  .banner h2{font-size:16pt}
  .banner p{max-width:none}
  .grid2,.scenes{grid-template-columns:1fr 1fr;gap:8px}
  .card,.scene,.pairrow{padding:8px 11px;gap:5px;border-radius:8px}
  .card ul,.card ol{gap:1px}
  .small{font-size:9pt}
  .note{font-size:9pt}
  .quote{font-size:11.5pt}
  .mix{gap:3px}
  .axes{gap:3px}
  .strip{height:10px}
  .result section{gap:6px!important}
  .pairs{gap:6px}
  .four{grid-template-columns:repeat(4,1fr);gap:6px}
  .nat{padding:7px 9px;gap:3px;border-radius:8px;break-inside:avoid}
  .nat p{font-size:9pt}
  .nat i{font-size:8pt}
  .fourwrap{gap:6px}
  .pairrow{grid-template-columns:auto 1fr;gap:10px}
  .pairrow p{font-size:9.5pt}
  .scene p{font-size:9.5pt}
  .card,.scene,.pairrow,.banner,.mixrow{break-inside:avoid}
}
/* 접속 잠금 화면 */
html.locked .wrap{display:none}
.gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:var(--bg);z-index:100}
html.locked .gate{display:flex}
.gate form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px;display:flex;flex-direction:column;gap:14px}
.gate h2{font-size:1.3rem}
.gate p{margin:0;color:var(--muted);font-size:.93rem}
.gate input{font:inherit;font-size:1.05rem;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);letter-spacing:.08em}
.gate input:focus{outline:2px solid var(--focus);outline-offset:1px}
.gate button{font:inherit;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--ink);color:var(--surface);cursor:pointer}
.gate .err{color:var(--danger);font-size:.9rem;min-height:1.3em}
</style>
</head>
<body>
<script>document.documentElement.classList.add('locked');</script>
<div class="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <form id="gateForm" autocomplete="off">
    <h2 id="gateTitle">교직원 자연 유형</h2>
    <p id="gateMsg">비밀번호를 입력하세요.</p>
    <input id="gatePw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="비밀번호" required>
    <div class="err" id="gateErr" aria-live="polite"></div>
    <button type="submit" id="gateBtn">들어가기</button>
  </form>
</div>

  var SK='staff-nature-key';
  function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  function b64(a){var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
  function norm(s){return s.normalize('NFC').toLowerCase().replace(/[\s-]/g,'');}
  var f=document.getElementById('gateForm'),pw=document.getElementById('gatePw'),err=document.getElementById('gateErr'),btn=document.getElementById('gateBtn');
  var S=window.crypto&&window.crypto.subtle;
  if(!S){err.textContent='이 주소에서는 열 수 없습니다. https 주소나 내려받은 파일로 열어 주세요.';btn.disabled=true;return;}
  function open(key){
    return S.decrypt({name:'AES-GCM',iv:u8(D.iv)},key,u8(D.ct)).then(function(buf){
      var p=JSON.parse(new TextDecoder().decode(buf));
      document.body.insertAdjacentHTML('beforeend',p.html);
      var sc=document.createElement('script');sc.textContent=p.js;document.body.appendChild(sc);
      document.documentElement.classList.remove('locked');
      document.querySelector('.gate').remove();
      return key;
    });
  }
  function derive(p){
    return S.importKey('raw',new TextEncoder().encode(norm(p)),'PBKDF2',false,['deriveKey']).then(function(base){
      return S.deriveKey({name:'PBKDF2',salt:u8(D.salt),iterations:D.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);});
  }
  /* 같은 탭에서 새로고침할 때는 다시 묻지 않도록 파생 키만 탭 세션에 보관 */
  var saved=null;try{saved=sessionStorage.getItem(SK);}catch(e){}
  if(saved){
    S.importKey('raw',u8(saved),'AES-GCM',false,['decrypt']).then(open).catch(function(){try{sessionStorage.removeItem(SK);}catch(e){}pw.focus();});
  } else setTimeout(function(){pw.focus();},0);
  f.addEventListener('submit',function(e){
    e.preventDefault();
    btn.disabled=true;btn.textContent='확인 중…';err.textContent='';
    var k;
    derive(pw.value).then(function(key){k=key;return open(key);}).then(function(){
      return S.exportKey('raw',k).then(function(raw){try{sessionStorage.setItem(SK,b64(new Uint8Array(raw)));}catch(x){}});
    }).catch(function(){
      btn.disabled=false;btn.textContent='들어가기';err.textContent='비밀번호가 맞지 않습니다.';pw.select();
    });
  });
